<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <!-- Bootstrap 5 CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-primary">

    <!-- Main Container -->
    <div class="container min-vh-100 d-flex justify-content-center align-items-center">

        <!-- Login Card -->
        <div class="card shadow-lg border-0 rounded-3"
             style="width: 450px;">

            <div class="card-body p-4">

                <!-- Wallet Image -->
                <div class="text-center mb-2">
                    <img
                        src="https://cdn-icons-png.flaticon.com/512/2830/2830284.png"
                        alt="Login"
                        style="width: 190px; height: 190px; object-fit: contain;">
                </div>

                <!-- Title -->
                <h2 class="text-center fw-semibold mb-4">
                    Login
                </h2>

                <!-- Login Form -->
                <form action="login.jsp" method="get">

                    <!-- Mobile Number -->
                    <div class="mb-3">
                        <label for="mobile"
                               class="form-label fs-5">
                            Mobile Number
                        </label>

                        <input
                            type="tel"
                            class="form-control form-control-lg"
                            id="mobile" name="mobile"
                            placeholder="Enter mobile number"
                            maxlength="10">
                    </div>

                    <!-- Login Button -->
                    <div class="d-grid mt-3">
                  <input
                            type="submit"
                            class="btn btn-primary btn-lg" value="Login">
                            
                      </form>   
                    </div>
                    
                    <!-- Signup -->
                    <div class="mt-2">
                        <a href="#" class="fs-5" data-bs-toggle="modal" data-bs-target="#exampleModal">
                            New User? Signup
                        </a>
                    </div>
                
                

            </div>
        </div>

    </div>

   <!-- Modal -->
<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="exampleModalLabel">Modal title</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
      <form action="register.jsp" method="get">
       <input class="form-control" type="text" name="name" placeholder="Enter Name" >
        <input class="form-control" type="text" name="mobile"  placeholder="Enter Mobile" >
       <input class="form-control" type="number" name="bal" placeholder="Enter Opening Balance" >
       
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="submit" class="btn btn-primary">Save changes</button>
      </div>
      </form>
    </div>
  </div>
</div>
     

    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
